---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        # The migration scenario checks that an installation made by an older
        # release of this role keeps its data across the switch of container
        # image. That is a property of the container and of what is on disk,
        # neither of which the host's distribution has a say in, so it runs on
        # one of them only - the organization's runner pool is shared.
        include:
          - distro: ubuntu2604
            scenario: default
          - distro: debian13
            scenario: default
          - distro: ubuntu2604
            scenario: migration
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: etcd

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: etcd/.python-version
          cache: pip
          cache-dependency-path: etcd/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: etcd
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('etcd/molecule/default/requirements.yml') }}

      - name: Run Molecule
        working-directory: etcd
        run: molecule test --scenario-name ${{ matrix.scenario }}
