---
# Project source code URL: https://github.com/etcd-io/etcd

etcd_enabled: true

etcd_identifier: etcd
etcd_base_path: "/{{ etcd_identifier }}"
etcd_data_path: "{{ etcd_base_path }}/data"
etcd_tmp_path: "{{ etcd_base_path }}/tmp"

# The path (inside the container) that `etcd_data_path` is mounted at.
etcd_container_data_path: /etcd-data

# The path (inside the container) that etcd is told to keep its data at.
#
# Note the extra `data` component. Up to and including the v3.6.4-9 release,
# this role ran Bitnami's container image, whose entrypoint pointed etcd at a
# `data` subdirectory of the mounted volume. Every installation made by this
# role therefore keeps its data in `{{ etcd_data_path }}/data` on the host, and
# preserving that layout is what lets those installations carry their data over
# to the official container image, rather than quietly bootstrapping an empty
# new cluster beside it.
etcd_container_data_dir_path: "{{ etcd_container_data_path }}/data"

# The path (inside the container) that `etcd_tmp_path` is mounted at.
#
# The container runs with a read-only root filesystem, so without this there is
# nowhere for `etcdctl snapshot save` and similar commands to write to.
etcd_container_tmp_path: /tmp

# renovate: datasource=docker depName=gcr.io/etcd-development/etcd versioning=semver
etcd_version: v3.7.1

etcd_uid: ""
etcd_gid: ""

etcd_container_image: "{{ etcd_container_image_registry_prefix }}etcd-development/etcd:{{ etcd_container_image_tag }}"
etcd_container_image_tag: "{{ etcd_version }}"
etcd_container_image_registry_prefix: "{{ etcd_container_image_registry_prefix_upstream }}"
etcd_container_image_registry_prefix_upstream: "{{ etcd_container_image_registry_prefix_upstream_default }}"
etcd_container_image_registry_prefix_upstream_default: gcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
etcd_container_network: "{{ etcd_identifier }}"

# Control if the container network is deleted on uninstalling.
etcd_container_network_deletion_enabled: true

# Specify how the container publishes its client communication port (as defined by `etcd_container_client_communication_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2379"), just a port number or an empty string to not expose.
etcd_container_client_communication_bind_port: ""

# Specify how the container publishes its peer communication port (as defined by `etcd_container_peer_communication_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2380"), just a port number or an empty string to not expose.
#
# Note that this role runs a single-member etcd, which listens for peers on
# `localhost` inside the container. Publishing the port therefore does not by
# itself make anything answer on it - `ETCD_LISTEN_PEER_URLS` has to be set
# through `etcd_environment_variables_additional_variables` as well.
etcd_container_peer_communication_bind_port: ""

# The client communication port number in the container
etcd_container_client_communication_port: 2379

# The peer communication port number in the container
etcd_container_peer_communication_port: 2380

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
etcd_container_additional_networks: "{{ etcd_container_additional_networks_auto + etcd_container_additional_networks_custom }}"
etcd_container_additional_networks_auto: []
etcd_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
etcd_container_additional_volumes: "{{ etcd_container_additional_volumes_auto + etcd_container_additional_volumes_custom }}"
etcd_container_additional_volumes_auto: []
etcd_container_additional_volumes_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
etcd_container_extra_arguments: "{{ etcd_container_extra_arguments_auto + etcd_container_extra_arguments_custom }}"
etcd_container_extra_arguments_auto: []
etcd_container_extra_arguments_custom: []

# List of systemd services that the etcd systemd service depends on
etcd_systemd_required_services_list: "{{ etcd_systemd_required_services_list_default + etcd_systemd_required_services_list_auto + etcd_systemd_required_services_list_custom }}"
etcd_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
etcd_systemd_required_services_list_auto: []
etcd_systemd_required_services_list_custom: []

# List of systemd services that the etcd systemd service wants
etcd_systemd_wanted_services_list: "{{ etcd_systemd_wanted_services_list_default + etcd_systemd_wanted_services_list_auto + etcd_systemd_wanted_services_list_custom }}"
etcd_systemd_wanted_services_list_default: []
etcd_systemd_wanted_services_list_auto: []
etcd_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
etcd_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
etcd_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
etcd_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
etcd_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ etcd_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ etcd_container_stop_grace_time_seconds }} {{ etcd_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ etcd_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ etcd_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ etcd_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ etcd_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ etcd_identifier }} after {{ etcd_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
etcd_environment_variables_tz: UTC

# Controls the `ETCD_NAME` environment variable.
# Human-readable name for this member.
# See: https://etcd.io/docs/v3.4/op-guide/configuration/
etcd_environment_variable_etcd_name: "{{ inventory_hostname }}-{{ etcd_identifier }}"

# Controls the `ETCD_LOG_LEVEL` environment variable.
# See: https://etcd.io/docs/v3.4/op-guide/configuration/#--log-level
# Valid values: debug, info, warn, error, panic, or fatal
etcd_environment_variable_etcd_log_level: info

# Controls the `ETCD_ADVERTISE_CLIENT_URLS` environment variable.
# See: https://etcd.io/docs/v3.4/op-guide/configuration/#--advertise-client-urls
etcd_environment_variable_etcd_advertise_client_urls: "http://{{ etcd_identifier }}:2379"

# Controls the `ETCD_LISTEN_CLIENT_URLS` environment variable.
# See: https://etcd.io/docs/v3.4/op-guide/configuration/#--listen-client-urls
etcd_environment_variable_etcd_listen_client_urls: "http://0.0.0.0:2379"

# The password for etcd's `root` user.
#
# Unless `etcd_environment_variable_allow_none_authentication` is set to
# `true`, this must be set. The role then creates the `root` user with this
# password and turns etcd's authentication on after the service starts, so
# that etcd refuses unauthenticated clients.
#
# The name is a leftover from when this role ran Bitnami's container image,
# whose entrypoint script read an `ETCD_ROOT_PASSWORD` environment variable.
# etcd itself has no such variable, so this is no longer passed to the
# container - but the name is kept, because playbooks (mash-playbook among
# them) hand this same value to the clients that talk to etcd.
#
# Changing the value after the first start does not change the password that
# etcd already stores: doing that needs the current password, which the role
# does not have. Refer to docs/configuring-etcd.md for how to change it.
etcd_environment_variable_etcd_root_password: ""

# Controls whether etcd is left open to unauthenticated clients.
#
# When `true`, the role provisions no credentials and does not turn
# authentication on, and `etcd_environment_variable_etcd_root_password` may be
# left empty.
#
# Turning this on for an installation that already has authentication enabled
# does not turn it back off: that too needs the current root password. Refer to
# docs/configuring-etcd.md.
#
# The name is a leftover from Bitnami's container image, in the same way as
# `etcd_environment_variable_etcd_root_password` is.
etcd_environment_variable_allow_none_authentication: false

# Path to the script (on the host) which turns etcd's authentication on after
# the container starts. Only installed when authentication is called for.
etcd_auth_provisioning_script_path: "{{ etcd_base_path }}/provision-auth.sh"

# Controls how long the post-start authentication provisioning waits for etcd
# to start answering before it gives up and fails the systemd service.
#
# The systemd unit derives its `TimeoutStartSec` from this, so raising it does
# not need any other change.
etcd_auth_provisioning_timeout_seconds: 60

# Controls the delay between authentication provisioning attempts.
etcd_auth_provisioning_retry_delay_seconds: 2

# Additional environment variables.
etcd_environment_variables_additional_variables: ""

# etcd_restart_necessary controls whether the etcd systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
etcd_restart_necessary: false
